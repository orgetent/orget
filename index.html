<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#12263a;--mut:#62717f;--ac:#0f766e;--ac2:#e3f3f0;--line:#d9e2e7;--bad:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--card:#152634;--ink:#e6eef4;--mut:#93a4b3;--ac:#2dd4bf;--ac2:#12333a;--line:#26394a;--bad:#f97066;--ok:#47cd89}}
:root[data-theme="dark"]{--bg:#0e1a24;--card:#152634;--ink:#e6eef4;--mut:#93a4b3;--ac:#2dd4bf;--ac2:#12333a;--line:#26394a;--bad:#f97066;--ok:#47cd89}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;padding-bottom:84px}
header{padding:8px 14px;background:var(--card);color:var(--ink);display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--ac)}.lg{height:46px;width:auto;border-radius:8px;background:#fff}.bn{flex:1;min-width:0}#who{font-size:13px;text-align:right;color:var(--mut)}#who button{padding:3px 10px;margin-left:6px}header b{font-size:18px;color:var(--ac);display:block;line-height:1.2}header small{display:block;color:var(--mut);font-size:12px}.hero{text-align:center;margin:4px 0 14px}.ph{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);cursor:pointer}.pf{display:flex;gap:10px;align-items:center}.pf img{width:44px;height:44px;border-radius:50%;object-fit:cover}a{color:var(--ac)}.row button{padding:2px 10px;margin-left:6px;font-size:13px}.hl{width:min(62%,230px);border-radius:14px;background:#fff}.hero h2{margin:6px 0 0;color:var(--ac)}
main{max-width:640px;margin:0 auto;padding:12px 14px}h2{font-size:19px;margin:8px 0}h3{margin:6px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--mut);font-size:14px}.k b{display:block;font-size:21px;color:var(--ink)}
.k.due{grid-column:1/-1;border-left:5px solid var(--bad)}.k.due b{color:var(--bad);font-size:26px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.it small,.mut{color:var(--mut)}.it>div:last-child{text-align:right}
.bad{color:var(--bad)}.ok{color:var(--ok)}
button,input,select{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer}button.g2{background:var(--ac2);color:var(--ac)}
.bar{display:flex;gap:8px;margin:8px 0}.bar input{flex:1}
.row2{display:flex;gap:6px;margin:6px 0}.row2 select{flex:2}.row2 input{flex:1;min-width:0}.row2 button{padding:8px 10px}
.pwrap{position:relative;flex:2;min-width:0}.pwrap input{width:100%}
.psug{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:180px;overflow:auto}
.sug{padding:8px 10px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}.sug:last-child{border:0}.sug:active{background:var(--ac2)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;margin:8px 0;font-size:14px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 1px;font-size:13px}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
dialog{max-height:88vh;overflow:auto;border:0;border-radius:14px;width:min(92vw,440px);background:var(--card);color:var(--ink);padding:16px}dialog::backdrop{background:#0008}
.r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.docs figure{margin:0;font-size:12px;text-align:center}.docs img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.login{max-width:360px;margin:30px auto}.login h2{text-align:center}.login button{width:100%;margin-top:10px}.err{color:var(--bad);font-size:14px;min-height:20px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-left:4px}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;color:inherit;resize:vertical}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.pci{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--ac2)}.noimg{display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:12px}
.pn{font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}.pp{font-size:17px;font-weight:700;color:var(--ac)}.pc small{display:block}
.cbar{gap:6px}.btn{flex:1;display:inline-block;text-align:center;border-radius:10px;padding:8px 6px;text-decoration:none;color:#fff!important;font-size:13px}.btn.wa{background:#128c7e}.btn.cl{background:var(--ac)}
details.mrec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:8px 12px}details.mrec summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between}
.gtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;z-index:999;font-size:15px}
</style>

  backup: async () => { const GB = { dr: D.dr, gd: D.gd, gp: D.gp }; if (!FEAT.garage) { try { [GB.dr, GB.gd, GB.gp] = await Promise.all([FB.getDocs('drivers', []), FB.getDocs('gdays', []), FB.getDocs('gpays', [])]); } catch (e) { alert('গ্যারেজের ডাটা পড়া যায়নি: ' + (e.code || e.message)); return; } } let docs = []; try { docs = await FB.getDocs('cdocs', []); } catch (e) { alert('ডকুমেন্ট পড়া যায়নি: ' + (e.code || e.message)); return; }

async function importBackup(o, asg, accAll) {
  const ops = [], n = { c: 0, s: 0, p: 0, dr: 0, gd: 0, d: 0 }, have = new Set(D.c.map(c => c.id)), cOff = {}; D.c.forEach(c => cOff[c.id] = c.officerId || '');
  const docsBy = {}; (o.documents || []).forEach(d => (docsBy[d.cid] = docsBy[d.cid] || []).push(d)); let maxLoan = 100145;
  for (const c of (o.customers || [])) {
    maxLoan = Math.max(maxLoan, +c.loan || 0); if (have.has(c.id)) continue; n.c++; cOff[c.id] = asg;
    const pic = (docsBy[c.id] || []).find(d => d.n == 'কাস্টমারের ছবি'); let th = c.th || ''; if (!th && pic) th = await shrink(pic.img, 96, .5).catch(() => '');
    ops.push({ t: 'set', p: 'customers/' + c.id, d: { ...c, officerId: asg, th } }); if (nidN(c.nid)) ops.push({ t: 'set', p: 'nids/' + nidN(c.nid), d: { cid: c.id } }); if (c.loan) ops.push({ t: 'set', p: 'loginIndex/' + c.loan, d: { v: 1, role: 'customer', cid: c.id } });
    (docsBy[c.id] || []).forEach(d => { if (!DI[d.id]) { n.d++; ops.push({ t: 'set', p: 'cdocs/' + d.id, d: { id: d.id, cid: c.id, kind: 'cust', officerId: asg, n: d.n, img: d.img } }); } });
  }
  for (const s of (o.sales || [])) { if (D.s.some(x => x.id == s.id)) continue; n.s++; const off = s.cid == 'walkin' ? '' : (cOff[s.cid] || ''); ops.push({ t: 'set', p: 'sales/' + s.id, d: { ...s, officerId: off } });
    if (accAll) items(s).filter(t => t.own === false).forEach(t => ops.push({ t: 'set', p: 'acc/' + t.k, d: { a: t.a, by: t.by, at: 'import', cid: s.cid, officerId: off } })); }
  for (const p of (o.products || [])) { if (D.p.some(x => x.id == p.id)) continue; n.p++; const { buy, ...r } = p; const pd = (docsBy[p.id] || []).find(d => d.n == 'পণ্যের ছবি'); if (!r.th && pd) r.th = await shrink(pd.img, 240, .6).catch(() => ''); ops.push({ t: 'set', p: 'products/' + p.id, d: r }, { t: 'set', p: 'pcost/' + p.id, d: { buy: buy || 0 } }); }
  for (const dr of (FEAT.garage ? (o.drivers || []) : [])) { if (D.dr.some(x => x.id == dr.id)) continue; n.dr++; const r = { ...dr }; const pd = (docsBy[dr.id] || []).find(d => d.n == 'ড্রাইভারের ছবি'); if (!r.th && pd) r.th = await shrink(pd.img, 160, .55).catch(() => ''); ops.push({ t: 'set', p: 'drivers/' + dr.id, d: r }); (docsBy[dr.id] || []).filter(d => d !== pd).forEach(d => { n.d++; ops.push({ t: 'set', p: 'cdocs/' + d.id, d: { id: d.id, cid: dr.id, kind: 'garage', n: d.n, img: d.img } }); }); }
  (FEAT.garage ? (docsBy['garage'] || []) : []).forEach(d => { if (!DI[d.id]) { n.d++; ops.push({ t: 'set', p: 'cdocs/' + d.id, d: { id: d.id, cid: 'garage', kind: 'garage', n: d.n, img: d.img } }); } });
  (FEAT.garage ? (o.gdays || []) : []).forEach(g => { if (!D.gd.some(x => x.id == g.id)) { n.gd++; ops.push({ t: 'set', p: 'gdays/' + g.id, d: g }); } });
  (FEAT.garage ? (o.gpays || []) : []).forEach(g => { if (!D.gp.some(x => x.id == g.id)) ops.push({ t: 'set', p: 'gpays/' + g.id, d: g }); });
  const cur = await FB.get('cnt/loan'); ops.push({ t: 'set', p: 'cnt/loan', d: { n: Math.max(maxLoan, (cur.exists && cur.data.n) || 0, ...D.c.map(x => +x.loan || 0)) } });
  await FB.batch(ops); return n;
}

<script>
(function () {
  'use strict';
  var GX = window.GX = { pm: null, mm: null, busy: {} };

  /* ---------- স্টাইল ---------- */
  var st = document.createElement('style');
  st.textContent = '.gh,.gr{display:grid;grid-template-columns:1.05fr 1.35fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}.gh{font-weight:600;color:var(--mut)}.gh span:nth-child(n+3),.gr span:nth-child(n+3){text-align:right}.gm{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.gm span:nth-child(n+2){text-align:right}.sm{padding:1px 8px!important;font-size:12px!important;margin-left:4px}.gtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;z-index:999;font-size:15px}';
  document.head.appendChild(st);
  GX.toast = function (m) { var t = document.createElement('div'); t.className = 'gtoast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2300); };

  /* ---------- হিসাবের মূল ---------- */
  var cur = function () { return today().slice(0, 7); };
  var mLabel = function (ym) { return new Date(ym + '-01T00:00').toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' }); };
  var shortD = function (d) { return new Date(d + 'T00:00').toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' }); };
  var sum = function (a, f) { return a.reduce(function (s, x) { return s + f(x); }, 0); };
  var ents = function (id) { return D.gd.filter(function (e) { return e.driverId == id && !e.kind; }); };
  var loansOf = function (id) { return D.gd.filter(function (e) { return e.driverId == id && e.kind == 'loan'; }); };
  var paysOf = function (id) { return D.gp.filter(function (p) { return p.driverId == id; }); };
  var amtOf = function (e) { return +e.amount || 0; };
  var loanOf = function (e) { return +e.loan || 0; };
  /* আগের পেজের পুরনো এন্ট্রিতে due ফিল্ড নেই, সেগুলোর বাকি আগের নিয়মে ধরা হয় */
  var eDue = function (e) { return e.due != null ? (+e.due || 0) : (e.status == 'charge' ? Math.max(0, (e.rent || 0) - (e.amount || 0)) : 0); };
  var eFare = function (e) { return amtOf(e) + eDue(e); };
  var STL = { charge: 'চার্জে ছিল', idle: 'বসা ছিল' };

  /* কোনো তারিখের আগ পর্যন্ত ড্রাইভারের মোট বাকি (বাকি + ধার − আদায়) */
  var owed = function (id, before) {
    var lt = function (x) { return (x.date || '') < before; };
    var r = sum(ents(id).filter(lt), eDue) + sum(loansOf(id).filter(lt), loanOf) - sum(paysOf(id).filter(lt), amtOf);
    return Math.max(0, r);
  };
  var outstanding = function (id) { return owed(id, '9999'); };
  var mStat = function (id, ym) {
    var inM = function (x) { return (x.date || '').slice(0, 7) == ym; };
    var E = ents(id).filter(inM), L = loansOf(id).filter(inM), P = paysOf(id).filter(inM);
    var cashD = sum(E, amtOf), payS = sum(P, amtOf);
    return { E: E, L: L, P: P, fare: sum(E, eFare), cashD: cashD, payS: payS, cash: cashD + payS, due: sum(E, eDue), loanS: sum(L, loanOf), open: owed(id, ym + '-01'), close: owed(id, ym + '-32') };
  };
  var monthsOf = function (id) {
    var set = {}; set[cur()] = 1;
    ents(id).concat(loansOf(id)).concat(paysOf(id)).forEach(function (x) { if (x.date) set[x.date.slice(0, 7)] = 1; });
    return Object.keys(set).sort().reverse();
  };
  var gStat = function (ym) {
    var f = 0, c = 0, cl = 0;
    D.dr.forEach(function (d) { var s = mStat(d.id, ym); f += s.fare; c += s.cash; cl += s.close; });
    var X = D.gd.filter(function (e) { return e.kind == 'exp' && (e.date || '').slice(0, 7) == ym; });
    return { fare: f, cash: c, close: cl, exp: sum(X, amtOf), X: X };
  };
  var monthsAll = function () {
    var set = {}; set[cur()] = 1;
    D.gd.forEach(function (x) { if (x.date) set[x.date.slice(0, 7)] = 1; });
    D.gp.forEach(function (x) { if (x.date) set[x.date.slice(0, 7)] = 1; });
    return Object.keys(set).sort().reverse();
  };
  var canEdit = function (e) { return isA() || e.date == today(); };

  /* ---------- আজকের আদায় ---------- */
  var rateTxt = function (d) { return 'চার্জে ভাড়া ' + tk(d.rent || 0) + (d.idleRent ? ' · বসার ভাড়া ' + tk(d.idleRent) : ' · বসার ভাড়া: প্রতিবার লিখবেন'); };
  var dailyV = function () {

    var g = gStat(ym);
    var h = '<div class="g"><div class="k"><b>' + tk(g.fare) + '</b>মোট ভাড়া</div><div class="k"><b>' + tk(g.cash) + '</b>ক্যাশ পেয়েছি</div><div class="k"><b>' + tk(g.exp) + '</b>খরচ</div><div class="k"><b>' + tk(g.cash - g.exp) + '</b>ক্যাশ − খরচ</div><div class="k due"><b>' + tk(g.close) + '</b>মাস শেষে মোট বাকি</div></div>';
    h += '<h2>ড্রাইভার অনুযায়ী</h2><div class="gm" style="font-weight:600;color:var(--mut)"><span>নাম</span><span>ভাড়া</span><span>ক্যাশ</span><span>বাকি</span></div>' + (D.dr.map(function (d) {
      var s = mStat(d.id, ym); return '<div class="gm" data-a="openDriver" data-id="' + d.id + '" style="cursor:pointer"><span>' + esc(d.name) + '</span><span>' + tk(s.fare) + '</span><span>' + tk(s.cash) + '</span><span class="' + (s.close ? 'bad' : '') + '">' + tk(s.close) + '</span></div>';
    }).join('') || empty('কোনো ড্রাইভার নেই।'));
    h += '<h2>খরচ</h2>' + (g.X.length ? g.X.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (x) {
      return '<div class="row"><span>' + dt(x.date) + ' · ' + esc(x.cat || '') + (x.note ? '<br><small class="mut">' + esc(x.note) + '</small>' : '') + '</span><span>' + tk(amtOf(x)) + '<button class="g2 sm" data-a="g2DelExp" data-id="' + x.id + '">✕</button></span></div>';
    }).join('') : empty('এই মাসে কোনো খরচ লেখা নেই।')) + '<div class="bar"><button data-a="g2AddExp">খরচ যোগ করুন</button></div>';
    return h;
  };
  var monthlyV = function () {
    var ym = GX.mm || cur(), all = monthsAll().filter(function (m) { return m != cur(); });
    var h = '<h2>' + mLabel(ym) + (ym == cur() ? ' (চলতি মাস)' : '') + '</h2>' + (ym != cur() ? '<div class="bar"><button class="g2" data-a="g2MM" data-id="">← চলতি মাসে ফিরুন</button></div>' : '') + monthDetail(ym);
    if (all.length) h += '<h2>আগের মাসগুলো</h2>' + all.map(function (m) {
      var g = gStat(m);
      return '<div class="it" data-a="g2MM" data-id="' + m + '"><div><b>' + mLabel(m) + '</b><br><small>মোট ' + tk(g.fare) + ' · ক্যাশ ' + tk(g.cash) + ' · বাকি ' + tk(g.close) + ' · খরচ ' + tk(g.exp) + '</small></div><div>›</div></div>';
    }).join('');
    return h;
  };
  A.g2MM = function (m) { GX.mm = m || null; render(); scrollTo(0, 0); };
  A.g2AddExp = function () {
    if (!isA()) return;
    form('খরচ যোগ করুন', F('dd', 'তারিখ', 'date', today(), 'required') + S('cat', 'খাত', '<option>বিদ্যুৎ বিল</option><option>গ্যারেজ ভাড়া</option><option>ওয়ার্কারের বেতন</option><option>অন্যান্য</option>') + F('amt', 'টাকা', 'number', '', 'required min="1"') + F('note', 'বিবরণ (ঐচ্ছিক)'), async function (r) {
      var amt = +r.amt; if (!(amt > 0)) { alert('সঠিক পরিমাণ দিন'); return false; }
      var e = { id: 'X' + uid(), driverId: '', kind: 'exp', date: r.dd, cat: r.cat, amount: amt, note: r.note || '', by: mySid(), bn: me.name };
      await FB.set('gdays/' + e.id, e); if (!D.gd.some(function (x) { return x.id == e.id; })) D.gd.push(e); mark('gd', e); GX.toast('খরচ যোগ হয়েছে ✓'); render();
    });
  };
  A.g2DelExp = async function (id) {
    if (!isA() || !confirm('এই খরচের এন্ট্রি মুছবেন?')) return;
    try { await FB.del('gdays/' + id); } catch (e) { alert('মোছা যায়নি'); return; }
    D.gd = D.gd.filter(function (x) { return x.id != id; }); delete SY.gd[id]; render();
  };

  /* ---------- গ্যারেজ পেজের কাঠামো ---------- */
  var nav2 = function () {
    var b = function (k, l) { return '<button class="' + (gTab == k ? '' : 'g2') + '" data-a="setGTab" data-id="' + k + '">' + l + '</button>'; };
    return '<div class="bar">' + b('daily', 'আজকের আদায়') + b('dr', 'ড্রাইভার') + (isA() ? b('m', 'মাসিক হিসেব') : '') + b('doc', 'ডকুমেন্ট') + '</div>';
  };
  var garage2 = function () {
    if (!isA() && gTab == 'm') gTab = 'daily';
    if (['daily', 'dr', 'm', 'doc'].indexOf(gTab) < 0) gTab = 'daily';
    return nav2() + ({ daily: dailyV, dr: driversV, m: monthlyV, doc: gdocsV })[gTab]();
  };

  /* ---------- লোন আইডি বদলানো (মালিক) ---------- */
  A.g2ChgId = function (cid) {
    var c = D.c.find(function (x) { return x.id == cid; }); if (!c || !isA()) return;
    form('লোন আইডি বদলান', '<p class="mut">এখন: <b>' + esc(c.loan) + '</b> — ' + esc(c.name) + '</p>' + F('nl', 'নতুন লোন আইডি (৬ সংখ্যা)', 'number', '', 'required') +
      F('pin', 'কাস্টমারের নতুন ৪ সংখ্যার পিন (আইডি বদলালে লগইন নতুন করে চালু করতে হয়)', 'tel', '', 'required inputmode="numeric" pattern="[0-9]{4}" maxlength="4"') +
      '<p class="mut">কাস্টমারের সব বিক্রি, জমা, কিস্তি ও ডকুমেন্ট একই থাকবে, শুধু আইডি বদলাবে।</p>', async function (r) {
      var nl = String(+r.nl), old = String(c.loan);
      if (!/^\d{6}$/.test(nl)) { alert('আইডি ৬ সংখ্যার হতে হবে'); return false; }
      if (!/^\d{4}$/.test(r.pin)) { alert('পিন ঠিক ৪টি সংখ্যা হতে হবে'); return false; }
      if (nl == old) { alert('এটাই তো এখনকার আইডি'); return false; }
      if (D.c.some(function (x) { return String(x.loan) == nl; })) { alert('এই আইডি আগেই অন্য কাস্টমার ব্যবহার করছে'); return false; }
      if ((await FB.get('loginIndex/' + nl)).exists) { alert('এই আইডি আগেই ব্যবহার হয়েছে'); return false; }
      var oix = await FB.get('loginIndex/' + old);
      var ops = [{ t: 'update', p: 'customers/' + cid, d: { loan: nl } }, { t: 'set', p: 'loginIndex/' + nl, d: { v: 1, role: 'customer', cid: cid } }, { t: 'del', p: 'loginIndex/' + old }];
      if (oix.exists && oix.data.uid) ops.push({ t: 'del', p: 'users/' + oix.data.uid });
      await FB.batch(ops); c.loan = nl;
      var msg = 'আইডি বদলানো হয়েছে: ' + old + ' → ' + nl + '।';
      try { await setPinFor(Object.assign({}, c, { loan: nl }), r.pin); msg += ' কাস্টমার এখন আইডি ' + nl + ' ও নতুন পিন দিয়ে ঢুকতে পারবে।'; }
      catch (e) { msg += ' পিন সেট হয়নি (' + (e.code || e.message) + ')। কাস্টমারের পাতা থেকে "লগইন পিন দিন" চাপুন।'; }
      try { await FB.set('cnt/loan', { n: Math.max.apply(null, [100145].concat(D.c.map(function (x) { return +x.loan || 0; }))) }); } catch (e) { }
      alert(msg); render();
    });
  };

  /* ---------- রেন্ডার জোড়া লাগানো ---------- */
  var baseRender = window.render;
  window.render = function () {
    baseRender();
    try {
      if (!me) return;
      var m = document.getElementById('m');
      if (typeof FEAT !== 'undefined' && FEAT.garage && (isG() || (isA() && tab == 'g'))) {
        if (view && view.t != 'dr') return;
        m.innerHTML = view ? driverV2(view.id) : garage2();
      } else if (isA() && view && view.t == 'c') {
        m.insertAdjacentHTML('beforeend', '<div class="bar"><button class="g2" data-a="g2ChgId" data-id="' + view.id + '">লোন আইডি বদলান</button></div>');
      }
    } catch (e) { console.warn('garage patch', e); }
  };
  try { render(); } catch (e) { }
})();

</script>
</body></html>
