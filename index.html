<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#12263a;--mut:#62717f;--ac:#0f766e;--ac2:#e3f3f0;--line:#d9e2e7;--bad:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--card:#152634;--ink:#e6eef4;--mut:#93a4b3;--ac:#2dd4bf;--ac2:#12333a;--line:#26394a;--bad:#f97066;--ok:#47cd89}}
:root[data-theme="dark"]{--bg:#0e1a24;--card:#152634;--ink:#e6eef4;--mut:#93a4b3;--ac:#2dd4bf;--ac2:#12333a;--line:#26394a;--bad:#f97066;--ok:#47cd89}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;padding-bottom:84px}
header{padding:8px 14px;background:var(--card);color:var(--ink);display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--ac)}.lg{height:46px;width:auto;border-radius:8px;background:#fff}.bn{flex:1;min-width:0}#who{font-size:13px;text-align:right;color:var(--mut)}#who button{padding:3px 10px;margin-left:6px}header b{font-size:18px;color:var(--ac);display:block;line-height:1.2}header small{display:block;color:var(--mut);font-size:12px}.hero{text-align:center;margin:4px 0 14px}.ph{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);cursor:pointer}.pf{display:flex;gap:10px;align-items:center}.pf img{width:44px;height:44px;border-radius:50%;object-fit:cover}a{color:var(--ac)}.row button{padding:2px 10px;margin-left:6px;font-size:13px}.hl{width:min(62%,230px);border-radius:14px;background:#fff}.hero h2{margin:6px 0 0;color:var(--ac)}
main{max-width:640px;margin:0 auto;padding:12px 14px}h2{font-size:19px;margin:8px 0}h3{margin:6px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--mut);font-size:14px}.k b{display:block;font-size:21px;color:var(--ink)}
.k.due{grid-column:1/-1;border-left:5px solid var(--bad)}.k.due b{color:var(--bad);font-size:26px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.it small,.mut{color:var(--mut)}.it>div:last-child{text-align:right}
.bad{color:var(--bad)}.ok{color:var(--ok)}
button,input,select{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer}button.g2{background:var(--ac2);color:var(--ac)}
.bar{display:flex;gap:8px;margin:8px 0}.bar input{flex:1}
.row2{display:flex;gap:6px;margin:6px 0}.row2 select{flex:2}.row2 input{flex:1;min-width:0}.row2 button{padding:8px 10px}
.pwrap{position:relative;flex:2;min-width:0}.pwrap input{width:100%}
.psug{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:180px;overflow:auto}
.sug{padding:8px 10px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}.sug:last-child{border:0}.sug:active{background:var(--ac2)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;margin:8px 0;font-size:14px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 1px;font-size:13px}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
dialog{max-height:88vh;overflow:auto;border:0;border-radius:14px;width:min(92vw,440px);background:var(--card);color:var(--ink);padding:16px}dialog::backdrop{background:#0008}
.r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.docs figure{margin:0;font-size:12px;text-align:center}.docs img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.login{max-width:360px;margin:30px auto}.login h2{text-align:center}.login button{width:100%;margin-top:10px}.err{color:var(--bad);font-size:14px;min-height:20px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-left:4px}
</style>

<script type="module">
// Firebase সংযোগের স্তর। বাকি অ্যাপ শুধু window.FB দিয়ে কথা বলে।
(async () => {
  if (window.__FB_MOCK) { window.__fbres(window.__FB_MOCK); return; }
  try {
    const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [AP, AU, S] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || /YOUR_/.test(cfg.apiKey + cfg.projectId)) throw new Error('firebase-config.js এ আপনার Firebase তথ্য বসানো হয়নি');
    const app = AP.initializeApp(cfg), auth = AU.getAuth(app);
    let db;
    try { db = S.initializeFirestore(app, { localCache: S.persistentLocalCache({ tabManager: S.persistentMultipleTabManager() }) }); }
    catch (e) { db = S.getFirestore(app); }
    const ref = p => S.doc(db, ...p.split('/'));
    const fix = v => (v && v.__incr != null) ? S.increment(v.__incr) : (v && v.__union) ? S.arrayUnion(...v.__union) : v;
    const prep = o => { const r = {}; for (const k in o) r[k] = fix(o[k]); return r; };
    const snap = s => ({ exists: s.exists(), data: s.exists() ? s.data() : null });
    const q = (col, cons) => (cons && cons.length) ? S.query(S.collection(db, col), ...cons.map(c => S.where(c[0], c[1], c[2]))) : S.collection(db, col);
    const FB = {
      incr: n => ({ __incr: n }), union: (...a) => ({ __union: a }),
      onAuth: cb => AU.onAuthStateChanged(auth, u => cb(u ? u.uid : null)),
      signIn: async (e, p) => (await AU.signInWithEmailAndPassword(auth, e, p)).user.uid,
      signUp: async (e, p) => (await AU.createUserWithEmailAndPassword(auth, e, p)).user.uid,
      signOut: async () => { await AU.signOut(auth); try { await S.terminate(db); await S.clearIndexedDbPersistence(db); } catch (e) { } },
      createUser: async (e, p) => {
        const sec = AP.getApps().find(a => a.name == 'sec') || AP.initializeApp(cfg, 'sec'), sa = AU.getAuth(sec);
        const r = await AU.createUserWithEmailAndPassword(sa, e, p); await AU.signOut(sa); return r.user.uid;
      },
      get: async p => snap(await S.getDoc(ref(p))),
      set: (p, d) => S.setDoc(ref(p), prep(d)),
      update: (p, d) => S.updateDoc(ref(p), prep(d)),
      del: p => S.deleteDoc(ref(p)),
      getDocs: async (col, cons) => (await S.getDocs(q(col, cons))).docs.map(d => ({ id: d.id, ...d.data() })),
      watch: (col, cons, cb, err) => S.onSnapshot(q(col, cons), sn => cb(sn.docs.map(d => ({ id: d.id, ...d.data() }))), err),
      watchDoc: (p, cb, err) => S.onSnapshot(ref(p), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), err),
      batch: async ops => {
        let b = S.writeBatch(db), n = 0, sz = 0;
        const flush = async () => { if (n) { await b.commit(); b = S.writeBatch(db); n = 0; sz = 0; } };
        for (const o of ops) {
          const w = o.d ? JSON.stringify(o.d).length : 0;
          if (n >= 400 || sz + w > 1500000) await flush();
          if (o.t == 'set') b.set(ref(o.p), prep(o.d)); else if (o.t == 'update') b.update(ref(o.p), prep(o.d)); else b.delete(ref(o.p));
          n++; sz += w;
        }
        await flush();
      },
      tx: fn => S.runTransaction(db, t => fn({
        get: async p => snap(await t.get(ref(p))),
        set: (p, d) => t.set(ref(p), prep(d)), update: (p, d) => t.update(ref(p), prep(d)), del: p => t.delete(ref(p))
      }))
    };
    window.__fbres(FB);
  } catch (e) { window.__fbres({ error: e }); }
})();

<script>
'use strict';
/* ORGET web — ৪ স্তর: owner / officer / garage / customer */
let FB, me = null, BK = null, STAFF = [], PC = {}, ACC = {}, DI = {}, W = [], settingUp = false;
const D = { c: [], p: [], s: [], dr: [], gd: [], gp: [] };
const SY = { c: {}, p: {}, s: {}, dr: {}, gd: {} };
const RL = { owner: 'মালিক', officer: 'অফিসার', garage: 'গ্যারেজ এডিটর', customer: 'কাস্টমার' };
const isA = () => !!me && me.role == 'owner', isO = () => !!me && me.role == 'officer', isG = () => !!me && me.role == 'garage', isC = () => !!me && me.role == 'customer';
const canAct = () => isA() || isO(), canGar = () => isA() || isG();
const mySid = () => isA() ? 'owner' : (me.sid || '');
const $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const tk = n => '৳' + Math.round(n).toLocaleString('bn-BD'), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), today = () => iso(new Date());
const dt = d => new Date(d + 'T00:00').toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
const cn = id => (D.c.find(x => x.id == id) || {}).name || '—', pn = id => (D.p.find(x => x.id == id) || {}).name || '—';
const CATS = { e: 'ইলেকট্রনিকস', f: 'ফার্নিচার', mo: 'মোবাইল', bm: 'বাটন মোবাইল', ga: 'গেজেট', gs: 'গ্যাস স্টোভ সেট', ki: 'কিচেন আইটেম', pl: 'প্লাস্টিক পণ্য' };
const offName = id => !id ? 'অনির্ধারিত' : (STAFF.find(x => x.id == id) || {}).name || (id == 'owner' ? 'মালিক' : '—');
const officers = () => STAFF.filter(x => x.role == 'officer' && x.active !== false);
const normId = s => String(s || '').trim().toLowerCase();
const nidN = s => String(s || '').replace(/\D/g, '');
const pinPw = p => p + '#orget';
const emailOf = (id, v) => id + '-' + v + '@orget.app';
const authMsg = e => { const c = (e && e.code) || ''; return /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'আইডি বা পাসওয়ার্ড ভুল' : /too-many/.test(c) ? 'অনেকবার ভুল হয়েছে, কিছুক্ষণ পরে চেষ্টা করুন' : /network/.test(c) ? 'ইন্টারনেট সংযোগ নেই' : /weak-password/.test(c) ? 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে' : (c || (e && e.message) || 'ব্যর্থ'); };

/* ---------- সংরক্ষণ ---------- */
const SER = {
  c: x => [['customers/' + x.id, x]], s: x => [['sales/' + x.id, x]], dr: x => [['drivers/' + x.id, x]], gd: x => [['gdays/' + x.id, x]],
  p: x => { const { buy, ...r } = x; return [['products/' + x.id, r], ['pcost/' + x.id, { buy: buy || 0 }]]; }
};
let saveChain = Promise.resolve();
function save() { const p = saveChain.then(saveNow); saveChain = p.catch(() => { }); return p; }
async function saveNow() {
  for (const k in SER) for (const x of D[k]) {
    const j = JSON.stringify(x);
    if (SY[k][x.id] !== j) {
      SY[k][x.id] = j;
      for (const [p, d] of SER[k](x)) {
        if (k == 'p' && !isA() && p.startsWith('pcost')) continue;
        try { await FB.set(p, JSON.parse(JSON.stringify(d))); } catch (e) { alert('সংরক্ষণ ব্যর্থ: ' + (e.code || e.message)); }
      }
    }
  }
}
const mark = (k, x) => { SY[k][x.id] = JSON.stringify(x); };

/* ---------- হিসাবের মূল ---------- */
const items = s => { const r = [], a = s.type == 'c' ? s.total : s.down; if (a > 0) r.push({ k: s.id + '_0', a, by: s.by, bn: s.bn, own: !!s.own, d: s.date, l: s.type == 'c' ? 'নগদ' : 'ডাউন পেমেন্ট', s }); (s.inst || []).forEach((i, x) => { if (i.paid) r.push({ k: s.id + '_' + (x + 1), a: i.a, by: i.by, bn: i.bn, own: !!i.own, d: i.pd, l: 'কিস্তি', s }); }); (s.payments || []).forEach((pm, x) => { r.push({ k: s.id + '_p' + x, a: pm.amt, by: pm.by, bn: pm.bn, own: !!pm.own, d: pm.date, l: 'জমা', s }); }); return r; };
const ok = t => !!ACC[t.k] || t.own !== false, paid = s => items(s).filter(ok).reduce((a, t) => a + t.a, 0), due = s => s.total - paid(s);
const pend = () => D.s.flatMap(items).filter(t => !ok(t)), mp = () => pend().filter(t => isA() || t.by == mySid());
const F = (n, l, t = 'text', v = '', x = '') => `<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const S = (n, l, o, x = '') => `<label>${l}<select name="${n}" ${x}>${o}</select></label>`;
let tab = 'home', view = null, q = '';
