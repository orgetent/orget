<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#12263a;--mut:#62717f;--ac:#0f766e;--ac2:#e3f3f0;--line:#d9e2e7;--bad:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--card:#152634;--ink:#e6eef4;--mut:#93a4b3;--ac:#2dd4bf;--ac2:#12333a;--line:#26394a;--bad:#f97066;--ok:#47cd89}}
:root[data-theme="dark"]{--bg:#0e1a24;--card:#152634;--ink:#e6eef4;--mut:#93a4b3;--ac:#2dd4bf;--ac2:#12333a;--line:#26394a;--bad:#f97066;--ok:#47cd89}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;padding-bottom:84px}
header{padding:8px 14px;background:var(--card);color:var(--ink);display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--ac)}.lg{height:46px;width:auto;border-radius:8px;background:#fff}.bn{flex:1;min-width:0}#who{font-size:13px;text-align:right;color:var(--mut)}#who button{padding:3px 10px;margin-left:6px}header b{font-size:18px;color:var(--ac);display:block;line-height:1.2}header small{display:block;color:var(--mut);font-size:12px}.hero{text-align:center;margin:4px 0 14px}.ph{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);cursor:pointer}.pf{display:flex;gap:10px;align-items:center}.pf img{width:44px;height:44px;border-radius:50%;object-fit:cover}a{color:var(--ac)}.row button{padding:2px 10px;margin-left:6px;font-size:13px}.hl{width:min(62%,230px);border-radius:14px;background:#fff}.hero h2{margin:6px 0 0;color:var(--ac)}
main{max-width:640px;margin:0 auto;padding:12px 14px}h2{font-size:19px;margin:8px 0}h3{margin:6px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--mut);font-size:14px}.k b{display:block;font-size:21px;color:var(--ink)}
.k.due{grid-column:1/-1;border-left:5px solid var(--bad)}.k.due b{color:var(--bad);font-size:26px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.it small,.mut{color:var(--mut)}.it>div:last-child{text-align:right}
.bad{color:var(--bad)}.ok{color:var(--ok)}
button,input,select{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer}button.g2{background:var(--ac2);color:var(--ac)}
.bar{display:flex;gap:8px;margin:8px 0}.bar input{flex:1}
.row2{display:flex;gap:6px;margin:6px 0}.row2 select{flex:2}.row2 input{flex:1;min-width:0}.row2 button{padding:8px 10px}
.pwrap{position:relative;flex:2;min-width:0}.pwrap input{width:100%}
.psug{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:180px;overflow:auto}
.sug{padding:8px 10px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}.sug:last-child{border:0}.sug:active{background:var(--ac2)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;margin:8px 0;font-size:14px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 1px;font-size:13px}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
dialog{max-height:88vh;overflow:auto;border:0;border-radius:14px;width:min(92vw,440px);background:var(--card);color:var(--ink);padding:16px}dialog::backdrop{background:#0008}
.r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.docs figure{margin:0;font-size:12px;text-align:center}.docs img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.login{max-width:360px;margin:30px auto}.login h2{text-align:center}.login button{width:100%;margin-top:10px}.err{color:var(--bad);font-size:14px;min-height:20px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-left:4px}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;color:inherit;resize:vertical}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.pci{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--ac2)}.noimg{display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:12px}
.pn{font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}.pp{font-size:17px;font-weight:700;color:var(--ac)}.pc small{display:block}
.cbar{gap:6px}.btn{flex:1;display:inline-block;text-align:center;border-radius:10px;padding:8px 6px;text-decoration:none;color:#fff!important;font-size:13px}.btn.wa{background:#128c7e}.btn.cl{background:var(--ac)}
details.mrec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:8px 12px}details.mrec summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between}
.gtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;z-index:999;font-size:15px}
</style>

<script type="module">
// Firebase সংযোগের স্তর। বাকি অ্যাপ শুধু window.FB দিয়ে কথা বলে।
(async () => {
  if (window.__FB_MOCK) { window.__fbres(window.__FB_MOCK); return; }
  try {
    const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [AP, AU, S] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || /YOUR_/.test(cfg.apiKey + cfg.projectId)) throw new Error('firebase-config.js এ আপনার Firebase তথ্য বসানো হয়নি');
    const app = AP.initializeApp(cfg), auth = AU.getAuth(app);
    // ক্যাশ শুধু মেমরিতে (ডিস্কে নয়) — এতে একাধিক ট্যাব/ডাটাবেস নিয়ে ঝামেলা হয় না
    const mk = id => { try { return S.initializeFirestore(app, { localCache: S.memoryLocalCache() }, id); } catch (e) { return S.getFirestore(app, id); } };
    const sleepErr = ms => new Promise((_, r) => setTimeout(() => r({ code: 'timeout' }), ms));
    let db = null;
    // ডাটাবেসের নাম "(default)" বা "default" যেটাই হোক, যেটা পাওয়া যায় সেটা ব্যবহার হবে
    for (const id of ['(default)', 'default']) {
      const d = mk(id);
      try { await Promise.race([S.getDocFromServer(S.doc(d, 'meta', 'setup')), sleepErr(9000)]); db = d; break; }
      catch (e) { if (e && e.code == 'permission-denied') { db = d; break; } try { await S.terminate(d); } catch (z) { } }
    }
    if (!db) db = mk('(default)');
    const ref = p => S.doc(db, ...p.split('/'));
    const fix = v => (v && v.__incr != null) ? S.increment(v.__incr) : (v && v.__union) ? S.arrayUnion(...v.__union) : v;
    const prep = o => { const r = {}; for (const k in o) r[k] = fix(o[k]); return r; };
    const snap = s => ({ exists: s.exists(), data: s.exists() ? s.data() : null });
    const q = (col, cons) => (cons && cons.length) ? S.query(S.collection(db, col), ...cons.map(c => S.where(c[0], c[1], c[2]))) : S.collection(db, col);
    const FB = {
      incr: n => ({ __incr: n }), union: (...a) => ({ __union: a }),
      onAuth: cb => AU.onAuthStateChanged(auth, u => cb(u ? u.uid : null)),
      signIn: async (e, p) => (await AU.signInWithEmailAndPassword(auth, e, p)).user.uid,
      signUp: async (e, p) => (await AU.createUserWithEmailAndPassword(auth, e, p)).user.uid,
      signOut: async () => { await AU.signOut(auth); try { await S.terminate(db); } catch (e) { } },
      createUser: async (e, p) => {
        const sec = AP.getApps().find(a => a.name == 'sec') || AP.initializeApp(cfg, 'sec'), sa = AU.getAuth(sec);
        const r = await AU.createUserWithEmailAndPassword(sa, e, p); await AU.signOut(sa); return r.user.uid;
      },
      get: async p => snap(await S.getDoc(ref(p))),
      set: (p, d) => S.setDoc(ref(p), prep(d)),
      update: (p, d) => S.updateDoc(ref(p), prep(d)),
      del: p => S.deleteDoc(ref(p)),
      getDocs: async (col, cons) => (await S.getDocs(q(col, cons))).docs.map(d => ({ id: d.id, ...d.data() })),
      watch: (col, cons, cb, err) => S.onSnapshot(q(col, cons), sn => cb(sn.docs.map(d => ({ id: d.id, ...d.data() }))), err),
      watchDoc: (p, cb, err) => S.onSnapshot(ref(p), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), err),
      batch: async ops => {
        let b = S.writeBatch(db), n = 0, sz = 0;
        const flush = async () => { if (n) { await b.commit(); b = S.writeBatch(db); n = 0; sz = 0; } };
        for (const o of ops) {
          const w = o.d ? JSON.stringify(o.d).length : 0;
          if (n >= 400 || sz + w > 1500000) await flush();
          if (o.t == 'set') b.set(ref(o.p), prep(o.d)); else if (o.t == 'update') b.update(ref(o.p), prep(o.d)); else b.delete(ref(o.p));
          n++; sz += w;
        }
        await flush();
      },
      tx: fn => S.runTransaction(db, t => fn({
        get: async p => snap(await t.get(ref(p))),
        set: (p, d) => t.set(ref(p), prep(d)), update: (p, d) => t.update(ref(p), prep(d)), del: p => t.delete(ref(p))
      }))
    };
    window.__fbres(FB);
  } catch (e) { window.__fbres({ error: e }); }
})();

<script>
'use strict';
/* ORGET web — ৪ স্তর: owner / officer / garage / customer */
let FB, me = null, BK = null, STAFF = [], PC = {}, ACC = {}, DI = {}, W = [], settingUp = false;
const D = { c: [], p: [], s: [], dr: [], gd: [], gp: [] };
const SY = { c: {}, p: {}, s: {}, dr: {}, gd: {} };
const RL = { owner: 'মালিক', officer: 'অফিসার', garage: 'গ্যারেজ এডিটর', customer: 'কাস্টমার' };
const isA = () => !!me && me.role == 'owner', isO = () => !!me && me.role == 'officer', isG = () => !!me && me.role == 'garage', isC = () => !!me && me.role == 'customer';
const canAct = () => isA() || isO(), canGar = () => isA() || isG();
const mySid = () => isA() ? 'owner' : (me.sid || '');
const $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const tk = n => '৳' + Math.round(n).toLocaleString('bn-BD'), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), today = () => iso(new Date());
const dt = d => new Date(d + 'T00:00').toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
const cn = id => (D.c.find(x => x.id == id) || {}).name || '—', pn = id => (D.p.find(x => x.id == id) || {}).name || '—';
const CATS = { e: 'ইলেকট্রনিকস', f: 'ফার্নিচার', mo: 'মোবাইল', bm: 'বাটন মোবাইল', ga: 'গেজেট', gs: 'গ্যাস স্টোভ সেট', ki: 'কিচেন আইটেম', pl: 'প্লাস্টিক পণ্য' };
const offName = id => !id ? 'অনির্ধারিত' : (STAFF.find(x => x.id == id) || {}).name || (id == 'owner' ? 'মালিক' : '—');
const officers = () => STAFF.filter(x => x.role == 'officer' && x.active !== false);
const normId = s => String(s || '').trim().toLowerCase();
const nidN = s => String(s || '').replace(/\D/g, '');
const pinPw = p => p + '#orget';
const emailOf = (id, v) => id + '-' + v + '@orget.app';
const authMsg = e => { const c = (e && e.code) || ''; return /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'আইডি বা পাসওয়ার্ড ভুল' : /too-many/.test(c) ? 'অনেকবার ভুল হয়েছে, কিছুক্ষণ পরে চেষ্টা করুন' : /network/.test(c) ? 'ইন্টারনেট সংযোগ নেই' : /weak-password/.test(c) ? 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে' : (c || (e && e.message) || 'ব্যর্থ'); };

/* ---------- সংরক্ষণ ---------- */
const SER = {
  c: x => [['customers/' + x.id, x]], s: x => [['sales/' + x.id, x]], dr: x => [['drivers/' + x.id, x]], gd: x => [['gdays/' + x.id, x]],
  p: x => { const { buy, ...r } = x; return [['products/' + x.id, r], ['pcost/' + x.id, { buy: buy || 0 }]]; }
};
let saveChain = Promise.resolve();
function save() { const p = saveChain.then(saveNow); saveChain = p.catch(() => { }); return p; }
async function saveNow() {
  for (const k in SER) for (const x of D[k]) {
    const j = JSON.stringify(x);
    if (SY[k][x.id] !== j) {
      SY[k][x.id] = j;
      for (const [p, d] of SER[k](x)) {
        if (k == 'p' && !isA() && p.startsWith('pcost')) continue;
        try { await FB.set(p, JSON.parse(JSON.stringify(d))); } catch (e) { alert('সংরক্ষণ ব্যর্থ: ' + (e.code || e.message)); }
      }
    }
  }
}
const mark = (k, x) => { SY[k][x.id] = JSON.stringify(x); };

/* ---------- হিসাবের মূল ---------- */
const items = s => { const r = [], a = s.type == 'c' ? s.total : s.down; if (a > 0) r.push({ k: s.id + '_0', a, by: s.by, bn: s.bn, own: !!s.own, d: s.date, l: s.type == 'c' ? 'নগদ' : 'ডাউন পেমেন্ট', s }); (s.inst || []).forEach((i, x) => { if (i.paid) r.push({ k: s.id + '_' + (x + 1), a: i.a, by: i.by, bn: i.bn, own: !!i.own, d: i.pd, l: 'কিস্তি', s }); }); (s.payments || []).forEach((pm, x) => { r.push({ k: s.id + '_p' + x, a: pm.amt, by: pm.by, bn: pm.bn, own: !!pm.own, d: pm.date, l: 'জমা', gid: pm.gid, s }); }); return r; };
const ok = t => !!ACC[t.k] || t.own !== false, paid = s => items(s).filter(ok).reduce((a, t) => a + t.a, 0), due = s => s.total - paid(s);

<div class="row"><span>কাস্টমার</span><span>${esc(custName(s))}${s.wp2 ? ' · ' + esc(s.wp2) : ''}</span></div><div class="row"><span>তারিখ</span><span>${dt(s.date)}</span></div><div class="row"><span>বিক্রি করেছেন</span><span>${esc(s.bn || 'মালিক')}</span></div><div class="row"><span>মোট মূল্য</span><b>${tk(s.total)}</b></div>${isC() ? '' : `<div class="row"><span>গৃহীত জমা</span><b class="ok">${tk(paid(s))}</b></div><div class="row"><span>বাকি</span><b class="bad">${tk(due(s))}</b></div>`}${items(s).some(t => !ok(t)) ? `<p class="bad">${tk(items(s).filter(t => !ok(t)).reduce((a, t) => a + t.a, 0))} মালিকের গ্রহণের অপেক্ষায়</p>` : ''}

/* ---------- স্টক, পণ্যের প্রোফাইল ও হোম (দোকান) ---------- */
let hq = '', sq = '', stockOpen = {}, guest = false, guestErr = false, sLoaded = false, pLoaded = false, syncing = false;

/* --- স্টক পাতা (মালিক ও অফিসার) --- */
const prodRowS = p => { const sd = pSold(p); return `<div class="it" data-a="openP" data-id="${p.id}"><div class="pf">${p.th ? `<img src="${p.th}" alt="">` : ph0}<div>${esc(p.name)}<br><small>${p.code ? esc(p.code) + ' · ' : ''}${isA() ? 'ক্রয় ' + tk(p.buy || 0) + ' · ' : ''}বিক্রয় ${tk(p.sell)}${p.bought != null ? ' · কেনা ' + bnN(p.bought) + ' · বিক্রি ' + bnN(sd) : ''}</small></div></div><div class="${(+p.qty || 0) < 3 ? 'bad' : ''}"><b>${bnN(p.qty)}</b> টি<br><small>স্টক</small></div></div>`; };
const catHead = (k, all, open) => {
  const pcs = all.reduce((a, p) => a + (+p.qty || 0), 0), out = all.filter(p => (+p.qty || 0) <= 0).length, buy = all.reduce((a, p) => a + (+p.buy || 0) * (+p.qty || 0), 0), sell = all.reduce((a, p) => a + (+p.sell || 0) * (+p.qty || 0), 0);
  return `<div class="it" data-a="togCat" data-id="${k}" style="background:var(--ac2)"><div><b>${open ? '▾' : '▸'} ${esc(catName(k))}</b><br><small>${bnN(all.length)} রকম পণ্য · স্টকে ${bnN(pcs)} পিস${out ? ' · ' + bnN(out) + ' টির স্টক শেষ' : ''}</small></div><div>${isA() ? `<small>কেনা অনুযায়ী</small> <b>${tk(buy)}</b><br>` : ''}<small>বিক্রি অনুযায়ী</small> <b>${tk(sell)}</b></div></div>`;
};
const stockList = () => {
  const q = sq.trim();
  const h = catKeys().map(k => { const all = D.p.filter(p => p.cat == k); if (!all.length) return ''; const L = all.filter(p => pMatch(p, q)).sort(prodCmp); if (q && !L.length) return ''; const open = !!q || !!stockOpen[k]; return catHead(k, all, open) + (open ? L.map(prodRowS).join('') : ''); }).join('');

const prodL = () => {
  const tb = D.p.reduce((a, p) => a + (+p.buy || 0) * (+p.qty || 0), 0), ts = D.p.reduce((a, p) => a + (+p.sell || 0) * (+p.qty || 0), 0), pcs = D.p.reduce((a, p) => a + (+p.qty || 0), 0);

};

/* --- পণ্যের প্রোফাইল --- */

    + (staff && p.bought != null ? `<div class="k"><b>${bnN(p.bought)} পিস</b>মোট কেনা হয়েছে</div>` : '')

/* --- মালিকের হিসাব মেলানো: পুরনো পণ্যে কোড ও কেনার সংখ্যা বসানো, সর্বশেষ বিক্রির সময় হালনাগাদ --- */
function ownerSync() {
  if (!isA() || !sLoaded || !pLoaded || !D.p.length || syncing) return;
  const sold = {}, last = {};
  D.s.forEach(s => itemsOf(s).forEach(it => { if (it.pid) { sold[it.pid] = (sold[it.pid] || 0) + (+it.qty || 0); last[it.pid] = Math.max(last[it.pid] || 0, s.ts || 0); } }));
  let mx = 0; D.p.forEach(p => { const m = /(\d+)$/.exec(p.code || ''); if (m) mx = Math.max(mx, +m[1]); });
  const nc = {}; D.p.filter(p => !p.code).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'bn')).forEach(p => { nc[p.id] = 'P-' + String(++mx).padStart(3, '0'); });
  const ops = [];
  D.p.forEach(p => { const u = {}; if (p.bought == null) u.bought = (+p.qty || 0) + (sold[p.id] || 0); if (!p.code) u.code = nc[p.id]; if ((last[p.id] || 0) > (p.ls || 0)) u.ls = last[p.id]; if (Object.keys(u).length) ops.push({ t: 'update', p: 'products/' + p.id, d: u }); });
  if (ops.length) { syncing = true; FB.batch(ops).catch(e => console.warn('sync', e.code || e.message)).finally(() => { syncing = false; }); }
}

const offL = () => { const P = mp(); if (!P.length) return empty('গ্রহণের অপেক্ষায় কোনো টাকা নেই।'); const by = {}; P.forEach(t => (by[t.by] = by[t.by] || []).push(t));

    if (accAll) items(s).filter(t => t.own === false).forEach(t => ops.push({ t: 'set', p: 'acc/' + t.k, d: { a: t.a, by: t.by, at: 'import', cid: s.cid, officerId: off } })); }
  for (const p of (o.products || [])) { if (D.p.some(x => x.id == p.id)) continue; n.p++; const { buy, ...r } = p; const pd = (docsBy[p.id] || []).find(d => d.n == 'পণ্যের ছবি'); if (!r.th && pd) r.th = await shrink(pd.img, 240, .6).catch(() => ''); ops.push({ t: 'set', p: 'products/' + p.id, d: r }, { t: 'set', p: 'pcost/' + p.id, d: { buy: buy || 0 } }); }
  for (const dr of (o.drivers || [])) { if (D.dr.some(x => x.id == dr.id)) continue; n.dr++; const r = { ...dr }; const pd = (docsBy[dr.id] || []).find(d => d.n == 'ড্রাইভারের ছবি'); if (!r.th && pd) r.th = await shrink(pd.img, 160, .55).catch(() => ''); ops.push({ t: 'set', p: 'drivers/' + dr.id, d: r }); (docsBy[dr.id] || []).filter(d => d !== pd).forEach(d => { n.d++; ops.push({ t: 'set', p: 'cdocs/' + d.id, d: { id: d.id, cid: dr.id, kind: 'garage', n: d.n, img: d.img } }); }); }
  (docsBy['garage'] || []).forEach(d => { if (!DI[d.id]) { n.d++; ops.push({ t: 'set', p: 'cdocs/' + d.id, d: { id: d.id, cid: 'garage', kind: 'garage', n: d.n, img: d.img } }); } });
  (o.gdays || []).forEach(g => { if (!D.gd.some(x => x.id == g.id)) { n.gd++; ops.push({ t: 'set', p: 'gdays/' + g.id, d: g }); } });
  (o.gpays || []).forEach(g => { if (!D.gp.some(x => x.id == g.id)) ops.push({ t: 'set', p: 'gpays/' + g.id, d: g }); });
  const cur = await FB.get('cnt/loan'); ops.push({ t: 'set', p: 'cnt/loan', d: { n: Math.max(maxLoan, (cur.exists && cur.data.n) || 0, ...D.c.map(x => +x.loan || 0)) } });
  await FB.batch(ops); return n;
}

<script>
(function () {
  'use strict';
  var GX = window.GX = { pm: null, mm: null, busy: {} };

  /* ---------- স্টাইল ---------- */
  var st = document.createElement('style');
  st.textContent = '.gh,.gr{display:grid;grid-template-columns:1.05fr 1.35fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}.gh{font-weight:600;color:var(--mut)}.gh span:nth-child(n+3),.gr span:nth-child(n+3){text-align:right}.gm{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.gm span:nth-child(n+2){text-align:right}.sm{padding:1px 8px!important;font-size:12px!important;margin-left:4px}.gtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;z-index:999;font-size:15px}';
  document.head.appendChild(st);
  GX.toast = function (m) { var t = document.createElement('div'); t.className = 'gtoast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2300); };

  /* ---------- হিসাবের মূল ---------- */
  var cur = function () { return today().slice(0, 7); };
  var mLabel = function (ym) { return new Date(ym + '-01T00:00').toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' }); };
  var shortD = function (d) { return new Date(d + 'T00:00').toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' }); };
  var sum = function (a, f) { return a.reduce(function (s, x) { return s + f(x); }, 0); };
  var ents = function (id) { return D.gd.filter(function (e) { return e.driverId == id && !e.kind; }); };
  var loansOf = function (id) { return D.gd.filter(function (e) { return e.driverId == id && e.kind == 'loan'; }); };
  var paysOf = function (id) { return D.gp.filter(function (p) { return p.driverId == id; }); };
  var amtOf = function (e) { return +e.amount || 0; };
  var loanOf = function (e) { return +e.loan || 0; };
  /* আগের পেজের পুরনো এন্ট্রিতে due ফিল্ড নেই, সেগুলোর বাকি আগের নিয়মে ধরা হয় */
  var eDue = function (e) { return e.due != null ? (+e.due || 0) : (e.status == 'charge' ? Math.max(0, (e.rent || 0) - (e.amount || 0)) : 0); };
  var eFare = function (e) { return amtOf(e) + eDue(e); };
  var STL = { charge: 'চার্জে ছিল', idle: 'বসা ছিল' };

  /* কোনো তারিখের আগ পর্যন্ত ড্রাইভারের মোট বাকি (বাকি + ধার − আদায়) */
  var owed = function (id, before) {
    var lt = function (x) { return (x.date || '') < before; };
    var r = sum(ents(id).filter(lt), eDue) + sum(loansOf(id).filter(lt), loanOf) - sum(paysOf(id).filter(lt), amtOf);
    return Math.max(0, r);
  };
  var outstanding = function (id) { return owed(id, '9999'); };
  var mStat = function (id, ym) {
    var inM = function (x) { return (x.date || '').slice(0, 7) == ym; };
    var E = ents(id).filter(inM), L = loansOf(id).filter(inM), P = paysOf(id).filter(inM);
    var cashD = sum(E, amtOf), payS = sum(P, amtOf);
    return { E: E, L: L, P: P, fare: sum(E, eFare), cashD: cashD, payS: payS, cash: cashD + payS, due: sum(E, eDue), loanS: sum(L, loanOf), open: owed(id, ym + '-01'), close: owed(id, ym + '-32') };
  };
  var monthsOf = function (id) {
    var set = {}; set[cur()] = 1;
    ents(id).concat(loansOf(id)).concat(paysOf(id)).forEach(function (x) { if (x.date) set[x.date.slice(0, 7)] = 1; });
    return Object.keys(set).sort().reverse();
  };
  var gStat = function (ym) {
    var f = 0, c = 0, cl = 0;
    D.dr.forEach(function (d) { var s = mStat(d.id, ym); f += s.fare; c += s.cash; cl += s.close; });
    var X = D.gd.filter(function (e) { return e.kind == 'exp' && (e.date || '').slice(0, 7) == ym; });
    return { fare: f, cash: c, close: cl, exp: sum(X, amtOf), X: X };
  };
  var monthsAll = function () {
    var set = {}; set[cur()] = 1;
    D.gd.forEach(function (x) { if (x.date) set[x.date.slice(0, 7)] = 1; });
    D.gp.forEach(function (x) { if (x.date) set[x.date.slice(0, 7)] = 1; });
    return Object.keys(set).sort().reverse();
  };
  var canEdit = function (e) { return isA() || e.date == today(); };

  /* ---------- আজকের আদায় ---------- */
  var rateTxt = function (d) { return 'চার্জে ভাড়া ' + tk(d.rent || 0) + (d.idleRent ? ' · বসার ভাড়া ' + tk(d.idleRent) : ' · বসার ভাড়া: প্রতিবার লিখবেন'); };
  var dailyV = function () {
    var es = D.gd.filter(function (e) { return !e.kind && e.date == gDate; });
    var todo = D.dr.filter(function (d) { return !es.some(function (e) { return e.driverId == d.id; }); });
    var h = '<label>তারিখ<input type="date" value="' + gDate + '" onchange="gDate=this.value||today();render()"></label>' +
      '<div class="g"><div class="k"><b>' + tk(sum(es, amtOf)) + '</b>আজ ক্যাশ জমা</div><div class="k due"><b>' + tk(sum(es, eDue)) + '</b>আজ বাকি</div></div>';
    if (!D.dr.length) return h + empty('আগে "ড্রাইভার" ট্যাবে গিয়ে ড্রাইভার যোগ করুন।');
    h += '<h2>আজকের আদায় (' + todo.length + ' জন বাকি)</h2>';
    h += todo.map(function (d) {
      return '<div class="k" style="margin:8px 0;text-align:left"><div><b>' + esc(d.name) + '</b> <small class="mut">' + esc(d.veh || '') + '</small><br><small class="mut">' + rateTxt(d) + '</small></div>' +
        '<input type="hidden" data-gst="' + d.id + '" value=""><input type="hidden" data-gpay="' + d.id + '" value="paid">' +
        '<div class="bar"><button type="button" class="g2" data-a="g2St" data-id="' + d.id + '|charge">চার্জে ছিল</button><button type="button" class="g2" data-a="g2St" data-id="' + d.id + '|idle">বসা ছিল</button></div>' +
        '<div class="bar"><button type="button" data-a="g2Pay" data-id="' + d.id + '|paid">ক্যাশ জমা</button><button type="button" class="g2" data-a="g2Pay" data-id="' + d.id + '|due">বাকি</button></div>' +
        '<div class="bar"><input id="gam-' + d.id + '" type="number" inputmode="numeric" placeholder="আগে চার্জে/বসা বেছে নিন"></div>' +
        '<div class="bar"><button data-a="g2Save" data-id="' + d.id + '">সংরক্ষণ</button></div></div>';
    }).join('') || '<p class="ok">আজ সবার এন্ট্রি হয়ে গেছে ✓</p>';
    if (es.length) h += '<p class="mut">এন্ট্রি হয়ে গেছে ' + es.length + ' জনের। ভুল হলে ড্রাইভারের প্রোফাইলের চার্টে ✎ চেপে ঠিক করুন।</p>';
    return h;
  };
  A.g2St = function (key) {
    var p = key.split('|'), id = p[0], s = p[1], h = document.querySelector('[data-gst="' + id + '"]'); if (!h) return;
    h.value = h.value == s ? '' : s;
    document.querySelectorAll('[data-a="g2St"]').forEach(function (b) { var q = b.dataset.id.split('|'); if (q[0] == id) b.className = (h.value === q[1]) ? '' : 'g2'; });
    var d = D.dr.find(function (x) { return x.id == id; }) || {}, rate = h.value == 'charge' ? (d.rent || 0) : h.value == 'idle' ? (d.idleRent || 0) : 0, inp = document.getElementById('gam-' + id);
    inp.placeholder = !h.value ? 'আগে চার্জে/বসা বেছে নিন' : rate ? 'খালি রাখলে ' + tk(rate) + ' ধরা হবে' : 'টাকা লিখুন';
  };
  A.g2Pay = function (key) {
    var p = key.split('|'), id = p[0], v = p[1], h = document.querySelector('[data-gpay="' + id + '"]'); if (!h) return; h.value = v;
    document.querySelectorAll('[data-a="g2Pay"]').forEach(function (b) { var q = b.dataset.id.split('|'); if (q[0] == id) b.className = (v === q[1]) ? '' : 'g2'; });
  };
  A.g2Save = async function (id) {
    if (GX.busy[id]) return;

    if (!isA() || !confirm('এই খরচের এন্ট্রি মুছবেন?')) return;
    try { await FB.del('gdays/' + id); } catch (e) { alert('মোছা যায়নি'); return; }
    D.gd = D.gd.filter(function (x) { return x.id != id; }); delete SY.gd[id]; render();
  };

  /* ---------- গ্যারেজ পেজের কাঠামো ---------- */
  var nav2 = function () {
    var b = function (k, l) { return '<button class="' + (gTab == k ? '' : 'g2') + '" data-a="setGTab" data-id="' + k + '">' + l + '</button>'; };
    return '<div class="bar">' + b('daily', 'আজকের আদায়') + b('dr', 'ড্রাইভার') + (isA() ? b('m', 'মাসিক হিসেব') : '') + b('doc', 'ডকুমেন্ট') + '</div>';
  };
  var garage2 = function () {
    if (!isA() && gTab == 'm') gTab = 'daily';
    if (['daily', 'dr', 'm', 'doc'].indexOf(gTab) < 0) gTab = 'daily';
    return nav2() + ({ daily: dailyV, dr: driversV, m: monthlyV, doc: gdocsV })[gTab]();
  };

  /* ---------- লোন আইডি বদলানো (মালিক) ---------- */
  A.g2ChgId = function (cid) {
    var c = D.c.find(function (x) { return x.id == cid; }); if (!c || !isA()) return;
    form('লোন আইডি বদলান', '<p class="mut">এখন: <b>' + esc(c.loan) + '</b> — ' + esc(c.name) + '</p>' + F('nl', 'নতুন লোন আইডি (৬ সংখ্যা)', 'number', '', 'required') +
      F('pin', 'কাস্টমারের নতুন ৪ সংখ্যার পিন (আইডি বদলালে লগইন নতুন করে চালু করতে হয়)', 'tel', '', 'required inputmode="numeric" pattern="[0-9]{4}" maxlength="4"') +
      '<p class="mut">কাস্টমারের সব বিক্রি, জমা, কিস্তি ও ডকুমেন্ট একই থাকবে, শুধু আইডি বদলাবে।</p>', async function (r) {
      var nl = String(+r.nl), old = String(c.loan);
      if (!/^\d{6}$/.test(nl)) { alert('আইডি ৬ সংখ্যার হতে হবে'); return false; }
      if (!/^\d{4}$/.test(r.pin)) { alert('পিন ঠিক ৪টি সংখ্যা হতে হবে'); return false; }
      if (nl == old) { alert('এটাই তো এখনকার আইডি'); return false; }
      if (D.c.some(function (x) { return String(x.loan) == nl; })) { alert('এই আইডি আগেই অন্য কাস্টমার ব্যবহার করছে'); return false; }
      if ((await FB.get('loginIndex/' + nl)).exists) { alert('এই আইডি আগেই ব্যবহার হয়েছে'); return false; }
      var oix = await FB.get('loginIndex/' + old);
      var ops = [{ t: 'update', p: 'customers/' + cid, d: { loan: nl } }, { t: 'set', p: 'loginIndex/' + nl, d: { v: 1, role: 'customer', cid: cid } }, { t: 'del', p: 'loginIndex/' + old }];
      if (oix.exists && oix.data.uid) ops.push({ t: 'del', p: 'users/' + oix.data.uid });
      await FB.batch(ops); c.loan = nl;
      var msg = 'আইডি বদলানো হয়েছে: ' + old + ' → ' + nl + '।';
      try { await setPinFor(Object.assign({}, c, { loan: nl }), r.pin); msg += ' কাস্টমার এখন আইডি ' + nl + ' ও নতুন পিন দিয়ে ঢুকতে পারবে।'; }
      catch (e) { msg += ' পিন সেট হয়নি (' + (e.code || e.message) + ')। কাস্টমারের পাতা থেকে "লগইন পিন দিন" চাপুন।'; }
      try { await FB.set('cnt/loan', { n: Math.max.apply(null, [100145].concat(D.c.map(function (x) { return +x.loan || 0; }))) }); } catch (e) { }
      alert(msg); render();
    });
  };

  /* ---------- রেন্ডার জোড়া লাগানো ---------- */
  var baseRender = window.render;
  window.render = function () {
    baseRender();
    try {
      if (!me) return;
      var m = document.getElementById('m');
      if (isG() || (isA() && tab == 'g')) {
        if (view && view.t != 'dr') return;
        m.innerHTML = view ? driverV2(view.id) : garage2();
      } else if (isA() && view && view.t == 'c') {
        m.insertAdjacentHTML('beforeend', '<div class="bar"><button class="g2" data-a="g2ChgId" data-id="' + view.id + '">লোন আইডি বদলান</button></div>');
      }
    } catch (e) { console.warn('garage patch', e); }
  };
  try { render(); } catch (e) { }
})();

</script>
</body></html>
