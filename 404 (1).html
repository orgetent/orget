<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>অরগেট</title>
<script>
/* GitHub Pages এর জন্য: /orget/tech বা /orget/শোরুম-কোড লিংক মূল পাতায় পাঠায় */
var pathSegmentsToKeep = 1;
var l = window.location;
l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
</script></head><body style="font-family:sans-serif;text-align:center;margin-top:40px">লোড হচ্ছে…</body></html>
